name = "agronix-storage-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare R2 Bucket Binding
[[r2_buckets]]
binding = "OFFICER_RECORDS_BUCKET"
bucket_name = "agronix-officer-records"

# Environment Variables
[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGINS = "https://agronix.vercel.app,http://localhost:5173,http://localhost:4173"
ADMIN_EMAIL = "k.vinayreddy166@gmail.com"

# Secrets/vars to be configured via `wrangler secret put` or [vars]:
# - SUPABASE_URL         (e.g. https://<project>.supabase.co) — enables authoritative
#                         token verification via /auth/v1/user (supports ES256 keys)
# - SUPABASE_ANON_KEY    (public anon key, required together with SUPABASE_URL)
# - SUPABASE_JWT_SECRET  (legacy HS256 fallback, only needed if SUPABASE_URL is unset)
