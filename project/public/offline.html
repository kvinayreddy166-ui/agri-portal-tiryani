<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline | Tiryani Agriculture Portal</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef6f0;
        color: #0f172a;
      }
      main {
        width: min(88vw, 460px);
        border: 1px solid #d1fae5;
        border-radius: 24px;
        background: #ffffff;
        padding: 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 999px;
        object-fit: cover;
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 1.4rem;
        font-weight: 700;
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 0.95rem;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="Tiryani Agriculture Portal" />
      <h1>You are offline. Cached data available.</h1>
      <p>Open any previously visited section to continue with cached portal data. Reconnect to sync the latest records.</p>
    </main>
  </body>
</html>
