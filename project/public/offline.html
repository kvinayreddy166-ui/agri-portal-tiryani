<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f766e" />
    <title>Offline | Agronix</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #eef6f0;
        color: #0f172a;
      }
      main {
        width: min(88vw, 460px);
        border: 1px solid #d1fae5;
        border-radius: 24px;
        background: #ffffff;
        padding: 28px;
        text-align: center;
        box-shadow: 0 24px 60px rgba(15, 23, 42, 0.12);
        animation: fadeIn 0.6s ease-out;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      img {
        width: 92px;
        height: 92px;
        border-radius: 999px;
        object-fit: cover;
        animation: pulse 2s ease-in-out infinite;
      }
      @keyframes pulse {
        0%, 100% {
          transform: scale(1);
          box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.4);
        }
        50% {
          transform: scale(1.05);
          box-shadow: 0 0 20px 10px rgba(16, 185, 129, 0.2);
        }
      }
      @keyframes ping {
        75%, 100% {
          transform: scale(2);
          opacity: 0;
        }
      }
      h1 {
        margin: 18px 0 8px;
        font-size: 1.5rem;
        font-weight: 900;
        color: #0f766e;
        animation: slideUp 0.6s ease-out 0.2s backwards;
      }
      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      p {
        margin: 0;
        color: #475569;
        font-size: 1rem;
        font-weight: 700;
        line-height: 1.55;
        animation: slideUp 0.6s ease-out 0.4s backwards;
      }
    </style>
  </head>
  <body>
    <main>
      <div style="position: relative; display: inline-block; margin-bottom: 32px;">
        <img src="/images/agronix-logo-original.jpeg" alt="Agronix" />
        <div style="position: absolute; inset: -16px; display: flex; align-items: center; justify-content: center;">
          <div style="width: 128px; height: 128px; border-radius: 50%; background: rgba(16, 185, 129, 0.2); animation: ping 2s cubic-bezier(0, 0, 0.2, 1) infinite;"></div>
        </div>
      </div>
      <h1>AGRONIX is offline</h1>
      <p>Please reconnect and reopen the app</p>
    </main>
  </body>
</html>
