    <script>
      // Pre-boot watchdog only. All post-boot service-worker/cache management
      // lives in src/shared/lib/pwaRecovery.ts — keep it that way.
      (function () {
        var recoveryKey = 'tiryani-startup-recovery-v4';
        window.__TIRYANI_APP_BOOTED__ = false;
        // Set by App.tsx once React mounts — proves the bundle executed even if
        // auth/network are still settling.
        window.__TIRYANI_REACT_MOUNTED__ = false;

        function appBooted() {
          return Boolean(window.__TIRYANI_APP_BOOTED__ || window.__TIRYANI_REACT_MOUNTED__);
        }

        function safeSessionGet(key) {
          try { return sessionStorage.getItem(key); } catch (error) { return null; }
        }

        function safeSessionSet(key, value) {
          try { sessionStorage.setItem(key, value); } catch (error) {}
        }

        function clearAppBuildMetadata(resetStartupRecovery) {
          try { localStorage.removeItem('tiryani-app-build-version'); } catch (error) {}
          try {
            sessionStorage.removeItem('tiryani-startup-recovery-v1');
            sessionStorage.removeItem('tiryani-startup-recovery-v2');
            sessionStorage.removeItem('tiryani-startup-recovery-v3');
            if (resetStartupRecovery) {
              sessionStorage.removeItem(recoveryKey);
              sessionStorage.removeItem('tiryani-pwa-recovery-attempted-at');
            }
          } catch (error) {}
        }

        function clearCachesOnly() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        }

        function unregisterServiceWorkers() {
          if (!('serviceWorker' in navigator)) return Promise.resolve();
          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
          }).catch(function () {});
        }

        function reloadWithBust(reason, forceRoot) {
          var currentPath = window.location.pathname;
          var isPublicRoute = currentPath.startsWith('/officer-toolkit/') || currentPath === '/officer-toolkit';
          var targetPath = (forceRoot && !isPublicRoute) ? '/' : window.location.href;
          var url = new URL(targetPath, window.location.origin);
          url.searchParams.set('refresh', String(Date.now()));
          if (reason) url.searchParams.set('reason', reason);
          window.location.replace(url.toString());
        }

        function hardRefresh(reason) {
          var manualReset = reason === 'manual' || reason === 'cache-reset';
          var finished = false;
          var finish = function () {
            if (finished) return;
            finished = true;
            try {
              reloadWithBust(reason || 'cache-reset', manualReset);
            } catch (error) {
              window.location.reload();
            }
          };
          // Never let a hung service-worker/cache promise block the reload —
          // cap cleanup at 3s then force navigation regardless.
          window.setTimeout(finish, 3000);
          Promise.resolve()
            .then(function () { clearAppBuildMetadata(manualReset); })
            .then(unregisterServiceWorkers)
            .then(clearCachesOnly)
            .then(finish, finish);
          return;
        }

        function showRecoveryOptions() {
          if (appBooted()) return;
          var loader = document.getElementById('startup-loader');
          if (!loader) return;
          loader.innerHTML = '<img src="/images/agronix-logo-original.jpeg" alt="Agronix" style="height:96px;width:96px;border-radius:50%;object-fit:cover;background:white;box-shadow:0 18px 40px rgba(15,23,42,.16)" /><div style="font-size:16px;font-weight:900">New Update Available</div><div style="max-width:380px;text-align:center;font-size:13px;font-weight:600;color:#475569">A new version of Agronix is ready to install.</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px"><button type="button" onclick="(window.__TIRYANI_FORCE_REFRESH__ || function(){window.location.reload()})(\'manual\')" style="border:0;border-radius:12px;background:#047857;color:white;padding:10px 16px;font-weight:800">Update</button><button type="button" onclick="window.location.reload()" style="border:1px solid #a7f3d0;border-radius:12px;background:white;color:#047857;padding:10px 16px;font-weight:800">Later</button></div>';
        }

        function recoverFromStartupFailure(reason) {
          if (appBooted()) return;
          var attempts = Number(safeSessionGet(recoveryKey) || 0);
          if (attempts >= 2) {
            showRecoveryOptions();
            return;
          }
          safeSessionSet(recoveryKey, String(attempts + 1));
          hardRefresh(reason || 'startup');
        }

        // Dev server: never allow a SW — it serves stale Vite modules. Must run
        // before main.tsx because a controlled page can be served stale bundles.
        var isDevHost = /^(localhost|127\.0\.0\.1|\[::1\])$/.test(window.location.hostname);
        if (isDevHost) unregisterServiceWorkers();

        window.__TIRYANI_FORCE_REFRESH__ = hardRefresh;
        window.setTimeout(function () {
          if (!appBooted()) recoverFromStartupFailure('timeout');
        }, 12000);

        // Once the app has booted, chunk/script errors are pwaRecovery.ts's job.
        window.addEventListener('error', function () {
          if (!appBooted()) recoverFromStartupFailure('error');
        }, true);

        window.addEventListener('unhandledrejection', function () {
          if (!appBooted()) recoverFromStartupFailure('promise');
        });
      })();
    </script>
