    <script>
      (function () {
        var recoveryKey = 'tiryani-startup-recovery-v3';
        window.__TIRYANI_APP_BOOTED__ = false;

        function hardRefresh() {
          return Promise.resolve()
            .then(function () {
              if (!('serviceWorker' in navigator)) return;
              return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              });
            })
            .then(function () {
              if (!('caches' in window)) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (key) { return caches.delete(key); }));
              });
            })
            .finally(function () {
              var url = new URL(window.location.href);
              url.searchParams.set('refresh', String(Date.now()));
              window.location.replace(url.toString());
            });
        }

        function showRecoveryOptions() {
          var loader = document.getElementById('startup-loader');
          if (!loader) return;
          loader.innerHTML = '<img src="/images/agri-emblem-192.webp" alt="Tiryani Agriculture Portal" style="height:96px;width:96px;border-radius:50%;object-fit:cover;background:white;box-shadow:0 18px 40px rgba(15,23,42,.16)" /><div style="font-size:14px;font-weight:800">App is taking longer than expected.</div><div style="max-width:360px;text-align:center;font-size:13px;font-weight:600;color:#475569">Retry, or clear app cache to fetch the latest deployment files.</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" onclick="window.location.reload()" style="border:1px solid #a7f3d0;border-radius:12px;background:white;color:#047857;padding:10px 16px;font-weight:800">Retry</button><button type="button" onclick="window.__TIRYANI_FORCE_REFRESH__ && window.__TIRYANI_FORCE_REFRESH__()" style="border:0;border-radius:12px;background:#047857;color:white;padding:10px 16px;font-weight:800">Clear cache</button></div>';
        }

        function recoverFromStartupFailure() {
          if (window.__TIRYANI_APP_BOOTED__) return;
          var attempts = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (attempts >= 1) {
            showRecoveryOptions();
            return;
          }
          sessionStorage.setItem(recoveryKey, String(attempts + 1));
          hardRefresh();
        }

        function clearCachesOnly() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        }

        function releaseServiceWorkerControl() {
          if (!('serviceWorker' in navigator)) return;
          var hadController = Boolean(navigator.serviceWorker.controller);
          Promise.resolve()
            .then(function () {
              return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              });
            })
            .then(clearCachesOnly)
            .then(function () {
              if (!hadController) return;
              var resetKey = 'tiryani-html-sw-reset-v1';
              var alreadyReset = false;
              try {
                alreadyReset = sessionStorage.getItem(resetKey) === '1';
                sessionStorage.setItem(resetKey, '1');
              } catch (error) {
                alreadyReset = true;
              }
              if (alreadyReset) return;
              var url = new URL(window.location.href);
              url.searchParams.set('sw-reset', String(Date.now()));
              window.location.replace(url.toString());
            })
            .catch(function () {
              // Recovery is best-effort; normal network loading should continue.
            });
        }

        releaseServiceWorkerControl();
        window.__TIRYANI_FORCE_REFRESH__ = hardRefresh;
        window.setTimeout(function () {
          var loader = document.getElementById('startup-loader');
          var stillLoading = loader && document.body && document.body.innerText.indexOf('Loading Tiryani Agriculture Portal') !== -1;
          if (stillLoading) showRecoveryOptions();
        }, 8000);

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var isScriptFailure = target && target.tagName === 'SCRIPT';
          if (isScriptFailure) recoverFromStartupFailure();
        }, true);

      })();
    </script>
