      <div id="startup-loader" style="display:flex;min-height:100vh;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#0f172a;background:#eef6f0">

        <div style="font-size:14px;font-weight:700">Loading Tiryani Agriculture Portal...</div>
      </div>
    </div>
    <script>
      (function () {
        var recoveryKey = 'tiryani-startup-recovery-v2';
        window.__TIRYANI_APP_BOOTED__ = false;

        function hardRefresh() {
          return Promise.resolve()
            .then(function () {
              if (!('serviceWorker' in navigator)) return;
              return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              });
            })
            .then(function () {
              if (!('caches' in window)) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (key) {
                  return key.indexOf('tiryani-portal') === 0;
                }).map(function (key) { return caches.delete(key); }));
              });
            })
            .finally(function () {
              var url = new URL(window.location.href);
              url.searchParams.set('refresh', String(Date.now()));
              window.location.replace(url.toString());
            });
        }

        window.__TIRYANI_FORCE_REFRESH__ = hardRefresh;

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var isScriptFailure = target && target.tagName === 'SCRIPT';
          if (!isScriptFailure || window.__TIRYANI_APP_BOOTED__) return;
          var attempts = Number(sessionStorage.getItem(recoveryKey) || 0);
          if (attempts >= 1) return;
          sessionStorage.setItem(recoveryKey, String(attempts + 1));
          hardRefresh();
        }, true);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
