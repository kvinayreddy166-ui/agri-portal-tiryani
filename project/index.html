<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/images/agri-emblem-192.webp" />
    <link rel="apple-touch-icon" href="/images/agri-emblem-192.png" />
    <link rel="preload" as="image" href="/images/agri-emblem-192.webp" type="image/webp" fetchpriority="high" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#047857" />
    <title>Tiryani Agriculture Portal</title>
    <meta name="description" content="Tiryani Agriculture Portal - Information Management System for fertilizer, dealer, and crop management in Tiryani Mandal." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tiryani Agriculture Portal" />
    <meta property="og:description" content="Information Management System for fertilizer, dealer, crop, statutory forms, and agriculture office management in Tiryani Mandal." />
    <meta property="og:image" content="/images/agri-emblem-512.webp" />
    <meta property="og:image:alt" content="Tiryani Agriculture Portal emblem" />
    <meta name="twitter:title" content="Tiryani Agriculture Portal" />
    <meta name="twitter:description" content="Information Management System for Tiryani Agriculture Office." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/images/agri-emblem-512.webp" />
  </head>
  <body>
    <div id="root">
      <div id="startup-loader" style="display:flex;min-height:100vh;flex-direction:column;gap:16px;align-items:center;justify-content:center;font-family:system-ui,sans-serif;color:#0f172a;background:#eef6f0">
        <img src="/images/agri-emblem-192.webp" alt="Tiryani Agriculture Portal" style="height:96px;width:96px;border-radius:50%;object-fit:cover;background:white;box-shadow:0 18px 40px rgba(15,23,42,.16)" />
        <div style="font-size:14px;font-weight:700">Loading Tiryani Agriculture Portal...</div>
      </div>
    </div>
    <script>
      (function () {
        var recoveryKey = 'tiryani-startup-recovery-v1';
        window.__TIRYANI_APP_BOOTED__ = false;
        window.setTimeout(function () {
          if (window.__TIRYANI_APP_BOOTED__) return;
          var loader = document.getElementById('startup-loader');
          if (!loader) return;
          var alreadyTried = sessionStorage.getItem(recoveryKey);
          if (alreadyTried) {
            loader.innerHTML = '<img src="/images/agri-emblem-192.webp" alt="Tiryani Agriculture Portal" style="height:96px;width:96px;border-radius:50%;object-fit:cover;background:white;box-shadow:0 18px 40px rgba(15,23,42,.16)" /><div style="font-size:14px;font-weight:700">App update is ready. Please refresh once.</div><button onclick="location.reload()" style="border:0;border-radius:10px;background:#047857;color:white;padding:10px 16px;font-weight:800">Refresh</button>';
            return;
          }
          sessionStorage.setItem(recoveryKey, '1');
          Promise.resolve()
            .then(function () {
              if (!('serviceWorker' in navigator)) return;
              return navigator.serviceWorker.getRegistrations().then(function (registrations) {
                return Promise.all(registrations.map(function (registration) { return registration.unregister(); }));
              });
            })
            .then(function () {
              if (!('caches' in window)) return;
              return caches.keys().then(function (keys) {
                return Promise.all(keys.filter(function (key) {
                  return key.indexOf('tiryani-portal') === 0;
                }).map(function (key) { return caches.delete(key); }));
              });
            })
            .finally(function () {
              var url = new URL(window.location.href);
              url.searchParams.set('refresh', String(Date.now()));
              window.location.replace(url.toString());
            });
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
