    <script>
      (function () {
        var recoveryKey = 'tiryani-startup-recovery-v4';
        var resetKey = 'tiryani-html-sw-reset-v2';
        window.__TIRYANI_APP_BOOTED__ = false;

        function safeSessionGet(key) {
          try { return sessionStorage.getItem(key); } catch (error) { return null; }
        }

        function safeSessionSet(key, value) {
          try { sessionStorage.setItem(key, value); } catch (error) {}
        }

        function clearAppBuildMetadata(resetStartupRecovery) {
          try { localStorage.removeItem('tiryani-app-build-version'); } catch (error) {}
          try {
            sessionStorage.removeItem('tiryani-startup-recovery-v1');
            sessionStorage.removeItem('tiryani-startup-recovery-v2');
            sessionStorage.removeItem('tiryani-startup-recovery-v3');
            if (resetStartupRecovery) {
              sessionStorage.removeItem(recoveryKey);
              sessionStorage.removeItem(resetKey);
              sessionStorage.removeItem('tiryani-pwa-recovery-attempted-at');
            }
          } catch (error) {}
        }

        function syncRescueServiceWorker() {
          if (!('serviceWorker' in navigator)) return Promise.resolve(false);
          var hadController = Boolean(navigator.serviceWorker.controller);
          return navigator.serviceWorker.getRegistrations().then(function (registrations) {
            return Promise.all(registrations.map(function (registration) {
              try { registration.active && registration.active.postMessage({ type: 'CLEAR_RUNTIME_CACHES' }); } catch (error) {}
              try { registration.waiting && registration.waiting.postMessage({ type: 'SKIP_WAITING' }); } catch (error) {}
              try { return registration.update(); } catch (error) { return Promise.resolve(); }
            })).then(function () {
              var hasRootRegistration = registrations.some(function (registration) {
                try { return new URL(registration.scope).pathname === '/'; } catch (error) { return false; }
              });
              if (hasRootRegistration) return false;
              return navigator.serviceWorker.register('/service-worker.js', { scope: '/' }).then(function () { return true; });
            }).then(function (registered) { return hadController || registrations.length > 0 || registered; });
          }).catch(function () { return hadController; });
        }
        function clearCachesOnly() {
          if (!('caches' in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(keys.map(function (key) { return caches.delete(key); }));
          });
        }

        function reloadWithBust(reason, forceRoot) {
          var url = new URL(forceRoot ? '/' : window.location.href, window.location.origin);
          url.searchParams.set('refresh', String(Date.now()));
          if (reason) url.searchParams.set('reason', reason);
          window.location.replace(url.toString());
        }

        function hardRefresh(reason) {
          var manualReset = reason === 'manual' || reason === 'cache-reset';
          return Promise.resolve()
            .then(function () { clearAppBuildMetadata(manualReset); })
            .then(syncRescueServiceWorker)
            .then(clearCachesOnly)
            .finally(function () { reloadWithBust(reason || 'cache-reset', manualReset); });
        }

        function showRecoveryOptions() {
          if (window.__TIRYANI_APP_BOOTED__) return;
          var loader = document.getElementById('startup-loader');
          if (!loader) return;
          loader.innerHTML = '<img src="/images/agri-emblem-192.webp" alt="Tiryani Agriculture Portal" style="height:96px;width:96px;border-radius:50%;object-fit:cover;background:white;box-shadow:0 18px 40px rgba(15,23,42,.16)" /><div style="font-size:14px;font-weight:800">App could not start.</div><div style="max-width:380px;text-align:center;font-size:13px;font-weight:600;color:#475569">Old PWA files are being removed. Use Clear cache and reload once, then reopen the app if Android keeps the old installed shell.</div><div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center"><button type="button" onclick="window.location.reload()" style="border:1px solid #a7f3d0;border-radius:12px;background:white;color:#047857;padding:10px 16px;font-weight:800">Retry</button><button type="button" onclick="window.__TIRYANI_FORCE_REFRESH__ && window.__TIRYANI_FORCE_REFRESH__(\'manual\')" style="border:0;border-radius:12px;background:#047857;color:white;padding:10px 16px;font-weight:800">Clear cache and reload</button></div>';
        }

        function recoverFromStartupFailure(reason) {
          if (window.__TIRYANI_APP_BOOTED__) return;
          var attempts = Number(safeSessionGet(recoveryKey) || 0);
          if (attempts >= 2) {
            showRecoveryOptions();
            return;
          }
          safeSessionSet(recoveryKey, String(attempts + 1));
          hardRefresh(reason || 'startup');
        }

        function releaseServiceWorkerControl() {
          syncRescueServiceWorker()
            .then(clearCachesOnly)
            .then(function (hadServiceWorker) {
              if (!hadServiceWorker || safeSessionGet(resetKey) === '1') return;
              safeSessionSet(resetKey, '1');
              reloadWithBust('sw-reset', true);
            })
            .catch(function () {});
        }

        releaseServiceWorkerControl();
        window.__TIRYANI_FORCE_REFRESH__ = hardRefresh;
        window.setTimeout(function () {
          if (!window.__TIRYANI_APP_BOOTED__) recoverFromStartupFailure('timeout');
        }, 8000);

        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var isScriptFailure = target && target.tagName === 'SCRIPT';
          if (isScriptFailure || !window.__TIRYANI_APP_BOOTED__) recoverFromStartupFailure('error');
        }, true);

        window.addEventListener('unhandledrejection', function () {
          if (!window.__TIRYANI_APP_BOOTED__) recoverFromStartupFailure('promise');
        });
